<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BharatX Group — One Group. Six Businesses. One Connected Ecosystem.</title>
    <meta
      name="description"
      content="BharatX Group is a connected ecosystem of six businesses operating across technology, AI, infrastructure, manufacturing, agriculture, food systems and venture building."
    />
    <meta name="theme-color" content="#eef2f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("bharatx-theme");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BharatX Group" />
    <meta property="og:title" content="BharatX Group — One Connected Ecosystem" />

      property="og:description"
      content="Six businesses. One direction. Explore the BharatX Group ecosystem — technology, infrastructure, manufacturing, agriculture, food and venture building."
    />
    <meta property="og:image" content="/assets/backgrounds/hero-field.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BharatX Group — One Connected Ecosystem" />

      name="twitter:description"
      content="Six businesses. One direction. Explore the BharatX Group ecosystem."
